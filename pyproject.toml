[project]
name = "beyond-rag"
version = "0.1.0"
description = "Beyond a PoC — Enterprise RAG Sandbox featuring Elasticsearch 8.15 RBAC Pre-Filtering & Cross-Lingual (EN <-> ZH) Retrieval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "elasticsearch>=8.15.0,<9.0.0",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.0",
    "jieba>=0.42.1",
    "reportlab>=4.2.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=4.0.0",
    "langchain-ollama>=0.2.0",
    "pyjwt>=2.8.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
# Fixture generation only: committed fixtures do not need these at runtime.
fixtures = [
    "xlsxwriter>=3.2.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
]
# Cross-encoder re-ranking. Local ONNX model, downloaded on first use.
rerank = [
    "fastembed>=0.6.0",
]
# Scanned-page OCR. Large install, so opt-in (see RAG_OCR_LANGS).
ocr = [
    "paddleocr>=3.0.0,<4",
    "paddlepaddle>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
