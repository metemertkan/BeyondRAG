[project]
name = "beyond-rag"
version = "0.1.0"
description = "Beyond a PoC — Enterprise RAG Sandbox featuring Elasticsearch 8.15 RBAC Pre-Filtering & Cross-Lingual (EN <-> ZH) Retrieval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "elasticsearch>=8.15.0,<9.0.0",
    "pypdf>=5.0.0",
    "reportlab>=4.2.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=4.0.0",
    "langchain-ollama>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
