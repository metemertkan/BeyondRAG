services:
  beyondrag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beyondrag_app
    restart: unless-stopped
    ports:
      - "8090:8090"
    # Compose loads project `.env` for ${VAR} interpolation (copy from .env.example).
    # Explicit entries below forward RAG_EMBEDDING_* into the app container.
    environment:
      - WEB_HOST=${WEB_HOST:-0.0.0.0}
      - WEB_PORT=${WEB_PORT:-8090}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # Not taken from OLLAMA_BASE_URL in `.env`: that one is `localhost` for runs on the
      # host, and inside the container `localhost` is the container. Set
      # OLLAMA_DOCKER_BASE_URL to point the container at another Ollama.
      - OLLAMA_BASE_URL=${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - USE_LOCAL_ONLY=${USE_LOCAL_ONLY:-false}
      - RAG_EMBEDDING_PROVIDER=${RAG_EMBEDDING_PROVIDER:-feature_hash}
      - RAG_EMBEDDING_DIMS=${RAG_EMBEDDING_DIMS:-256}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-bge-m3}
      - RAG_EMBEDDING_API_KEY=${RAG_EMBEDDING_API_KEY:-}
      - RAG_EMBEDDING_API_BASE=${RAG_EMBEDDING_API_BASE:-https://api.openai.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - RAG_CORPUS_LANGUAGE=${RAG_CORPUS_LANGUAGE:-en}
      - RAG_LANGUAGE_PACKS_PATH=${RAG_LANGUAGE_PACKS_PATH:-}
      - RAG_CHUNKING_STRATEGY=${RAG_CHUNKING_STRATEGY:-adaptive}
      - RAG_XLSX_INLINE_ROWS=${RAG_XLSX_INLINE_ROWS:-40}
      - RAG_XLSX_LLM_SUMMARY=${RAG_XLSX_LLM_SUMMARY:-false}
      - RAG_OCR_LANGS=${RAG_OCR_LANGS:-}
      - RAG_GOVERNANCE_TOKEN=${RAG_GOVERNANCE_TOKEN:-}
      - RAG_ERASURE_KEY=${RAG_ERASURE_KEY:-}
      - RAG_VECTOR_INDEX_TYPE=${RAG_VECTOR_INDEX_TYPE:-int8_hnsw}
      - RAG_PARENT_CHILD=${RAG_PARENT_CHILD:-true}
      - RAG_PARENT_TOKENS=${RAG_PARENT_TOKENS:-1000}
      - RAG_CHILD_TOKENS=${RAG_CHILD_TOKENS:-200}
      - RAG_QUERY_MODE=${RAG_QUERY_MODE:-off}
      - RAG_RERANK=${RAG_RERANK:-false}
      - RAG_RERANK_CANDIDATES=${RAG_RERANK_CANDIDATES:-20}
      - RAG_RERANKER_MODEL=${RAG_RERANKER_MODEL:-BAAI/bge-reranker-base}
      - RAG_MULTI_HOP=${RAG_MULTI_HOP:-false}
      - RAG_VERIFY=${RAG_VERIFY:-false}
      - RAG_VERIFY_WITH_LLM=${RAG_VERIFY_WITH_LLM:-true}
      - RAG_TRUST_MODE=${RAG_TRUST_MODE:-annotate}
      - RAG_MIN_RELEVANCE=${RAG_MIN_RELEVANCE:-}
      - RAG_AUTH_MODE=${RAG_AUTH_MODE:-demo}
      - RAG_AUTH_SECRET=${RAG_AUTH_SECRET:-}
      - RAG_WRITE_ROLES=${RAG_WRITE_ROLES:-admin}
      - RAG_CORS_ORIGINS=${RAG_CORS_ORIGINS:-}
      - RAG_TENANT_MODE=${RAG_TENANT_MODE:-shared}
      - RAG_INDEX_PREFIX=${RAG_INDEX_PREFIX:-hk-rbac-rag-kb}
      - RAG_DEFAULT_TENANT=${RAG_DEFAULT_TENANT:-default}
      - FASTEMBED_CACHE_PATH=/app/workspace/.fastembed
      # Episode 6. Empty sends nothing anywhere. With the observability profile running,
      # set OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318 in .env.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-beyondrag}
      - OTEL_METRIC_EXPORT_INTERVAL=${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
      - OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-false}
      - RAG_LLM_TIMEOUT_SECONDS=${RAG_LLM_TIMEOUT_SECONDS:-180}
      - RAG_CONCEPT_MAX_TOKENS=${RAG_CONCEPT_MAX_TOKENS:-1024}
      - RAG_GUARDRAILS=${RAG_GUARDRAILS:-off}
      - RAG_GUARD_MAX_QUESTION_CHARS=${RAG_GUARD_MAX_QUESTION_CHARS:-2000}
      - RAG_GUARD_INJECTION=${RAG_GUARD_INJECTION:-block}
      - RAG_GUARD_ADVICE=${RAG_GUARD_ADVICE:-block}
      - RAG_GUARD_PII_QUESTION=${RAG_GUARD_PII_QUESTION:-redact}
      - RAG_GUARD_PII_ANSWER=${RAG_GUARD_PII_ANSWER:-redact}
      - RAG_GUARD_CONTEXT=${RAG_GUARD_CONTEXT:-drop}
      - RAG_GUARD_PROMPT_LEAK=${RAG_GUARD_PROMPT_LEAK:-block}
      - RAG_GUARD_JUDGE=${RAG_GUARD_JUDGE:-off}
      - RAG_GUARD_JUDGE_ON_ERROR=${RAG_GUARD_JUDGE_ON_ERROR:-allow}
      - RAG_TENANT_DAILY_TOKEN_BUDGET=${RAG_TENANT_DAILY_TOKEN_BUDGET:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./workspace:/app/workspace
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: beyondrag_elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    container_name: beyondrag_ollama
    profiles:
      - container-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Episode 6: Grafana with Prometheus (metrics), Tempo (traces) and Loki (logs) behind one
  # OpenTelemetry collector. Opt in: docker compose --profile observability up -d lgtm
  # A development image: one container, anonymous admin login, data lost with the container.
  lgtm:
    image: grafana/otel-lgtm:0.40.0
    container_name: beyondrag_lgtm
    profiles:
      - observability
    restart: unless-stopped
    ports:
      - "3000:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/beyondrag.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/beyondrag-dashboards:ro
      - ./observability/grafana/alerting/beyondrag-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/beyondrag-alerts.yaml:ro

volumes:
  es_data:
  ollama_data:
