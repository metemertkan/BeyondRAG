<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeyondRAG | Enterprise RBAC &amp; Cross-Lingual RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--br-bg);
      color: var(--br-ink);
      font-family: var(--br-font-body);
      font-size: 15px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--br-fix-tint); color: var(--br-ink); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--br-bg); }
    ::-webkit-scrollbar-thumb { background: var(--br-hair); border-radius: var(--br-radius); }
    ::-webkit-scrollbar-thumb:hover { background: var(--br-ink-2); }

    h1, h2 { font-family: var(--br-font-head); font-weight: 600; letter-spacing: -0.01em; margin: 0; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    code, .mono { font-family: var(--br-font-mono); }

    .app-header {
      border-bottom: var(--br-hairline) solid var(--br-hair);
      background: var(--br-bg);
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 40px; height: 40px;
      border: var(--br-stroke) solid var(--br-ink);
      border-radius: var(--br-radius);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--br-font-head);
      font-weight: 700;
      font-size: 15px;
      background: var(--br-surface);
      flex-shrink: 0;
    }
    .brand-title { font-family: var(--br-font-head); font-size: 1.25rem; font-weight: 700; line-height: 1.2; }
    .brand-sub { margin: 2px 0 0; font-size: 0.8125rem; color: var(--br-ink-2); }
    .header-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

    .role-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--br-surface);
      border: var(--br-hairline) solid var(--br-hair);
      border-radius: var(--br-radius);
    }
    .role-label { font-size: 0.8125rem; color: var(--br-ink-2); margin-right: 4px; }

    .btn {
      border: var(--br-hairline) solid var(--br-hair);
      background: var(--br-bg);
      color: var(--br-ink-2);
      border-radius: var(--br-radius);
      padding: 8px 14px;
      font-size: 0.875rem;
      font-weight: 600;
      transition: border-color var(--br-dur-emphasis) var(--br-ease),
                  color var(--br-dur-emphasis) var(--br-ease),
                  background var(--br-dur-emphasis) var(--br-ease);
    }
    .btn:hover { border-color: var(--br-ink-2); color: var(--br-ink); }
    .btn-active {
      background: var(--br-ink);
      border-color: var(--br-ink);
      color: var(--br-bg);
    }
    .btn-primary {
      background: var(--br-ink);
      border-color: var(--br-ink);
      color: var(--br-bg);
      font-weight: 600;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-theme {
      padding: 8px 12px;
      font-family: var(--br-font-mono);
      font-size: 0.75rem;
      font-weight: 500;
    }

    .layout {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    @media (min-width: 1024px) {
      .layout { grid-template-columns: 5fr 7fr; }
    }
    .layout > * { min-width: 0; }

    .panel {
      background: var(--br-surface);
      border: var(--br-hairline) solid var(--br-hair);
      border-radius: var(--br-radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel-chat {
      padding: 0;
      overflow: hidden;
      min-height: 640px;
      gap: 0;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .panel-title {
      font-family: var(--br-font-head);
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--br-ink);
    }
    .section-label { font-size: 0.8125rem; color: var(--br-ink-2); font-weight: 600; }

    .upload-box {
      background: var(--br-bg);
      border: var(--br-hairline) solid var(--br-hair);
      border-radius: var(--br-radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .drop-zone {
      border: var(--br-hairline) dashed var(--br-hair);
      border-radius: var(--br-radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      transition: border-color var(--br-dur-emphasis) var(--br-ease);
    }
    .drop-zone:hover { border-color: var(--br-ink-2); }
    .drop-label { font-size: 0.875rem; font-weight: 500; color: var(--br-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .drop-browse {
      padding: 4px 10px;
      border: var(--br-hairline) solid var(--br-hair);
      border-radius: var(--br-radius);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--br-ink-2);
      background: var(--br-surface);
      flex-shrink: 0;
    }
    .field-label { display: block; font-size: 0.8125rem; font-weight: 600; color: var(--br-ink-2); margin-bottom: 8px; }
    .field-hint { font-weight: 400; color: var(--br-ink-2); opacity: 0.85; }
    .text-input, .select-input {
      width: 100%;
      background: var(--br-bg);
      border: var(--br-hairline) solid var(--br-hair);
      border-radius: var(--br-radius);
      padding: 8px 12px;
      font-size: 0.875rem;
      color: var(--br-ink);
      outline: none;
      transition: border-color var(--br-dur-emphasis) var(--br-ease);
    }
    .text-input:focus, .select-input:focus { border-color: var(--br-ink-2); }
    .text-input.mono { font-family: var(--br-font-mono); font-size: 0.8125rem; }
    .text-input::placeholder { color: var(--br-ink-2); opacity: 0.7; }
    .select-input { width: auto; font-family: var(--br-font-mono); font-size: 0.75rem; color: var(--br-ink-2); }

    .row-between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .status-msg { font-size: 0.8125rem; font-weight: 500; color: var(--br-ink-2); min-height: 0; }
    .status-msg:empty { display: none; }
    .status-ok { color: var(--br-fix); font-weight: 600; }
    .status-err { color: var(--br-fail); font-weight: 600; }
    .status-busy { color: var(--br-ink-2); }

    .kb-list { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .kb-list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
    .role-banner { font-size: 0.75rem; font-family: var(--br-font-mono); color: var(--br-ink-2); }
    #documentsList { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-right: 4px; }

    .doc-row {
      padding: 12px 16px;
      border: var(--br-hairline) solid var(--br-hair);
      border-radius: var(--br-radius);
      background: var(--br-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color var(--br-dur-emphasis) var(--br-ease);
    }
    .doc-row:hover { border-color: var(--br-ink-2); }
    .doc-row.is-locked { opacity: 0.6; }
    .doc-row.is-superseded { opacity: var(--br-dim); }
    .doc-row.is-superseded:hover { border-color: var(--br-hair); }
    .doc-main { min-width: 0; flex: 1; }
    .doc-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .doc-name { font-size: 0.875rem; font-weight: 700; color: var(--br-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
    .doc-source { margin-top: 4px; font-size: 0.6875rem; font-family: var(--br-font-mono); color: var(--br-ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-ver { font-size: 0.6875rem; font-family: var(--br-font-mono); color: var(--br-ink-2); }

    .label {
      display: inline-block;
      padding: 2px 8px;
      border: var(--br-hairline) solid var(--br-hair);
      border-radius: var(--br-radius);
      font-size: 0.75rem;
      font-family: var(--br-font-mono);
      font-weight: 500;
      color: var(--br-ink-2);
      background: transparent;
      line-height: 1.4;
    }
    .label-ink { color: var(--br-ink); border-color: var(--br-ink-2); }
    .label-fix { color: var(--br-fix); border-color: var(--br-fix); background: var(--br-fix-tint); }
    .label-fail { color: var(--br-fail); border-color: var(--br-fail); background: var(--br-fail-tint); }
    .lifecycle-plain {
      font-size: 0.6875rem;
      font-family: var(--br-font-mono);
      font-weight: 500;
      color: var(--br-ink-2);
      letter-spacing: 0.02em;
    }
    .access-pill { flex-shrink: 0; font-size: 0.75rem; font-family: var(--br-font-mono); font-weight: 600; padding: 4px 10px; border-radius: var(--br-radius); border: var(--br-hairline) solid; }
    .access-ok { color: var(--br-fix); border-color: var(--br-fix); background: var(--br-fix-tint); }
    .access-locked { color: var(--br-fail); border-color: var(--br-fail); background: var(--br-fail-tint); }

    .tag-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: var(--br-hairline) solid var(--br-hair);
      border-radius: var(--br-radius);
      background: var(--br-bg);
      color: var(--br-ink-2);
      font-size: 0.875rem;
      font-weight: 600;
      transition: border-color var(--br-dur-emphasis) var(--br-ease), color var(--br-dur-emphasis) var(--br-ease), background var(--br-dur-emphasis) var(--br-ease);
    }
    .tag-btn:hover { border-color: var(--br-ink-2); color: var(--br-ink); }
    .tag-btn.is-active { background: var(--br-ink); border-color: var(--br-ink); color: var(--br-bg); }

    .access-preview { font-size: 0.75rem; font-family: var(--br-font-mono); font-weight: 500; padding: 4px 10px; border-radius: var(--br-radius); border: var(--br-hairline) solid var(--br-hair); color: var(--br-ink-2); }
    .access-preview.is-public { color: var(--br-fix); border-color: var(--br-fix); background: var(--br-fix-tint); }
    .access-preview.is-tagged { color: var(--br-ink); border-color: var(--br-ink-2); }

    .chat-top {
      padding: 16px;
      border-bottom: var(--br-hairline) solid var(--br-hair);
      background: var(--br-bg);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .prompt-label { font-size: 0.8125rem; font-weight: 600; color: var(--br-ink-2); margin-right: 4px; }
    .prompt-btn {
      padding: 6px 12px;
      border: var(--br-hairline) solid var(--br-hair);
      border-radius: var(--br-radius);
      background: var(--br-surface);
      color: var(--br-ink);
      font-size: 0.75rem;
      font-weight: 600;
      transition: border-color var(--br-dur-emphasis) var(--br-ease);
    }
    .prompt-btn:hover { border-color: var(--br-ink-2); }

    #chatMessages {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      background: var(--br-surface);
    }
    .msg-user { display: flex; justify-content: flex-end; }
    .msg-user-bubble {
      max-width: 90%;
      background: var(--br-bg);
      border: var(--br-hairline) solid var(--br-hair);
      border-radius: var(--br-radius);
      padding: 10px 16px;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .msg-user-bubble .q { font-weight: 600; }
    .msg-assistant {
      border: var(--br-stroke) solid var(--br-hair);
      border-radius: var(--br-radius);
      padding: 16px;
      background: var(--br-bg);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg-assistant.is-ok { border-color: var(--br-fix); }
    .msg-assistant.is-blocked { border-color: var(--br-fail); background: var(--br-fail-tint); }
    .msg-body { font-size: 0.875rem; line-height: 1.6; color: var(--br-ink); }
    .msg-body strong { font-weight: 700; color: var(--br-ink); }
    .msg-body em { color: var(--br-ink-2); }
    .msg-body code {
      padding: 2px 6px;
      border-radius: var(--br-radius);
      background: var(--br-surface);
      border: var(--br-hairline) solid var(--br-hair);
      font-family: var(--br-font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--br-ink);
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; }
    .lab-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .lab-field { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--br-ink-2); }
    .lab-field input[type="checkbox"] { accent-color: var(--br-fix); width: 16px; height: 16px; }
    .trace { border-top: var(--br-hairline) solid var(--br-hair); padding-top: 8px; font-size: 0.8125rem; }
    .trace summary { cursor: pointer; font-weight: 600; color: var(--br-ink-2); }
    .trace-stage { padding-top: 12px; display: grid; gap: 4px; }
    .trace-title { font-family: var(--br-font-mono); font-size: 0.6875rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--br-ink-2); }
    .trace-row { display: grid; grid-template-columns: 3.5em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
    .trace-row .rank { font-family: var(--br-font-mono); white-space: nowrap; }
    .trace-row .name { overflow-wrap: anywhere; }
    .trace-row .why { color: var(--br-ink-2); font-family: var(--br-font-mono); white-space: nowrap; }
    .trace-note { color: var(--br-ink-2); overflow-wrap: anywhere; }
    .trust-row { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 4px 0; }
    .trust-row .label { justify-self: start; }
    .rank.up { color: var(--br-fix); }
    .rank.down { color: var(--br-fail); }
    .meta-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .chat-form {
      padding: 16px;
      border-top: var(--br-hairline) solid var(--br-hair);
      background: var(--br-bg);
      display: flex;
      gap: 8px;
    }
    .chat-form .text-input { flex: 1; padding: 10px 16px; }

    .file-selected { color: var(--br-fix); font-weight: 700; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">BR</div>
        <div>
          <div class="brand-title">BeyondRAG</div>
          <p class="brand-sub">Multi-Tenant RBAC &amp; Cross-Lingual Knowledge Base</p>
        </div>
      </div>

      <div class="header-actions">
        <div class="role-bar" id="tenantBar">
          <span class="role-label">Tenant</span>
          <select id="tenantSelect" class="select-input" onchange="setTenant(this.value)" aria-label="Tenant"></select>
        </div>
        <div class="role-bar" id="roleBar">
          <span class="role-label">Role</span>
          <button type="button" onclick="setRolePreset([])" id="presetPublicBtn" class="btn">Public Only</button>
          <button type="button" onclick="setRolePreset(['finance'])" id="presetFinanceBtn" class="btn">Finance Role</button>
          <button type="button" onclick="setRolePreset(['operation'])" id="presetOperationBtn" class="btn">Operation Role</button>
          <button type="button" onclick="setRolePreset(['finance', 'operation'])" id="presetAllBtn" class="btn">All Roles</button>
          <button type="button" onclick="setRolePreset(['admin'])" id="presetAdminBtn" class="btn" title="Admins can upload, retag and delete">Admin</button>
        </div>
        <div class="role-bar" id="tokenBar" style="display:none">
          <span class="role-label">Token</span>
          <input id="tokenInput" type="password" class="text-input mono" style="width:220px" placeholder="Paste a bearer token" onchange="useSuppliedToken(this.value)" />
        </div>
        <button type="button" id="themeToggleBtn" class="btn btn-theme" onclick="toggleTheme()" aria-label="Toggle theme">Dark</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">1. Document Upload &amp; Knowledge Base</h2>
        <span id="uploadAccessPreview" class="access-preview"></span>
      </div>

      <div class="upload-box">
        <div id="dropZone" class="drop-zone" onclick="document.getElementById('pdfFileInput').click()">
          <input type="file" id="pdfFileInput" accept=".pdf,.md,.markdown,.txt,.xlsx,application/pdf,text/markdown,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden" style="display:none" onchange="handleFileSelect(event)" />
          <span id="selectedFileLabel" class="drop-label">Select PDF / Markdown / TXT</span>
          <span class="drop-browse">Browse</span>
        </div>

        <div>
          <label class="field-label" for="sourceKeyInput">
            source_key <span class="field-hint">(optional — same key supersedes prior version)</span>
          </label>
          <input id="sourceKeyInput" type="text" placeholder="e.g. hk-treasury-fx-liquidity-q4" class="text-input mono" />
        </div>

        <div class="row-between">
          <div class="row">
            <span class="section-label">RBAC Tag</span>
            <div id="uploadTagPills" class="row"></div>
          </div>
          <button id="uploadSubmitBtn" type="button" onclick="submitPdfUpload()" class="btn btn-primary">Upload &amp; Index</button>
        </div>
        <div id="uploadStatusMsg" class="status-msg"></div>
      </div>

      <div class="kb-list">
        <div class="kb-list-head">
          <span class="section-label">Knowledge Base (incl. SUPERSEDED)</span>
          <span id="chatRoleBanner" class="role-banner"></span>
        </div>
        <div id="documentsList"></div>
      </div>
    </section>

    <section class="panel panel-chat">
      <div class="chat-top">
        <div class="panel-head">
          <h2 class="panel-title">2. Multi-Lingual RBAC Chat</h2>
          <select id="synthesisModeSelect" class="select-input">
            <option value="fast">Instant Citation</option>
            <option value="llm">Grounded LLM (Ollama)</option>
          </select>
        </div>
        <div class="row" id="demoPromptsRow">
          <span class="prompt-label">Demo Prompts</span>
          <!-- Populated at runtime from /api/ui-demo-config (config/ui_demo.json). -->
        </div>
        <div class="lab-row" id="retrievalLab" aria-label="Retrieval options">
          <span class="prompt-label">Retrieval Lab</span>
          <label class="lab-field">Search
            <select id="labFusion" class="select-input">
              <option value="rrf">Hybrid (RRF)</option>
              <option value="dense">Dense only</option>
              <option value="lexical">BM25 only</option>
              <option value="linear">Added scores</option>
            </select>
          </label>
          <label class="lab-field">Query
            <select id="labQueryMode" class="select-input">
              <option value="off">As typed</option>
              <option value="multi">LLM rewrites</option>
              <option value="hyde">HyDE</option>
              <option value="both">Rewrites + HyDE</option>
            </select>
          </label>
          <label class="lab-field"><input type="checkbox" id="labRerank" /> Re-rank</label>
          <label class="lab-field"><input type="checkbox" id="labMultiHop" /> Multi-hop</label>
          <label class="lab-field"><input type="checkbox" id="labVerify" /> Verify answer</label>
          <label class="lab-field">Unsupported
            <select id="labTrustMode" class="select-input">
              <option value="annotate">Flag</option>
              <option value="strip">Remove</option>
              <option value="abstain">Refuse answer</option>
            </select>
          </label>
          <button type="button" class="btn" id="labSeedBtn" onclick="seedRetrievalLab()">Load lab documents</button>
        </div>
      </div>

      <div id="chatMessages"></div>

      <form onsubmit="handleChatSubmit(event)" class="chat-form">
        <input id="chatInput" type="text" placeholder="" class="text-input" />
        <button id="chatSendBtn" type="submit" class="btn btn-primary">Ask KB</button>
      </form>
    </section>
  </main>

  <script>
    let availableTags = ['finance', 'operation'];
    let selectedUploadTags = new Set();
    let activeUserRoles = new Set();
    let documents = [];
    let selectedPdfFile = null;

    // Identity. The server reads the tenant and roles from the signed token, so these
    // variables only decide what the page shows. Changing them here changes nothing
    // about what the API returns.
    let authMode = 'demo';
    let authToken = '';
    let activeTenant = '';
    let expandedRoles = new Set();
    let canWrite = false;

    async function loadAuthConfig() {
      const resp = await fetch('/api/auth/config');
      const cfg = await resp.json();
      authMode = cfg.mode;
      const demo = authMode === 'demo';
      document.getElementById('tenantBar').style.display = demo ? '' : 'none';
      document.getElementById('roleBar').style.display = demo ? '' : 'none';
      document.getElementById('tokenBar').style.display = demo ? 'none' : '';
      if (!demo) return;
      const select = document.getElementById('tenantSelect');
      select.innerHTML = (cfg.tenants || []).map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
      let saved = '';
      try { saved = localStorage.getItem('br-tenant') || ''; } catch (_) {}
      activeTenant = (cfg.tenants || []).includes(saved) ? saved : (cfg.tenants || [])[0] || '';
      select.value = activeTenant;
    }

    // Demo mode: ask the server to sign a token for the chosen persona.
    async function refreshIdentity() {
      if (authMode !== 'demo') return;
      const resp = await fetch('/api/auth/demo-token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tenant: activeTenant, roles: Array.from(activeUserRoles) }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || 'Could not get a demo token');
      authToken = data.token;
      expandedRoles = new Set(data.expanded_roles || []);
      canWrite = !!data.can_write;
    }

    // Required mode: the token comes from your identity provider. Read its claims for display only.
    async function useSuppliedToken(token) {
      authToken = (token || '').trim();
      try {
        const claims = JSON.parse(atob(authToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        activeTenant = String(claims.tenant || '');
        activeUserRoles = new Set(claims.roles || []);
        expandedRoles = new Set(claims.roles || []);
        canWrite = true;  // Unknown here; the server decides and answers 403 if not.
      } catch (_) {
        activeTenant = '';
      }
      await afterIdentityChange();
    }

    async function apiFetch(url, options = {}, retry = true) {
      const headers = Object.assign({}, options.headers || {}, { Authorization: `Bearer ${authToken}` });
      const resp = await fetch(url, Object.assign({}, options, { headers }));
      if (resp.status === 401 && retry && authMode === 'demo') {
        await refreshIdentity();  // The demo token expired.
        return apiFetch(url, options, false);
      }
      return resp;
    }

    function noteInChat(text) {
      const box = document.getElementById('chatMessages');
      box.insertAdjacentHTML('beforeend', `<div class="trace-note" style="text-align:center;margin:8px 0">${escapeHtml(text)}</div>`);
      box.scrollTop = box.scrollHeight;
    }

    async function afterIdentityChange() {
      renderUserRoleControls();
      updateWriteControls();
      await fetchDocumentsAndTags();
    }

    async function setTenant(tenant) {
      activeTenant = tenant;
      try { localStorage.setItem('br-tenant', tenant); } catch (_) {}
      await refreshIdentity();
      noteInChat(`Now signed in to tenant "${tenant}". Same roles, different company.`);
      await afterIdentityChange();
    }

    function updateWriteControls() {
      const btn = document.getElementById('uploadSubmitBtn');
      const seed = document.getElementById('labSeedBtn');
      btn.disabled = !canWrite;
      seed.disabled = !canWrite;
      const hint = canWrite ? '' : 'Uploading needs the Admin role in this tenant.';
      btn.title = hint;
      seed.title = hint;
      if (!canWrite) document.getElementById('uploadStatusMsg').textContent = hint;
      else if (document.getElementById('uploadStatusMsg').textContent.startsWith('Uploading needs')) document.getElementById('uploadStatusMsg').textContent = '';
    }

    function applyTheme(theme) {
      const root = document.documentElement;
      if (theme === 'dark') root.setAttribute('data-theme', 'dark');
      else root.removeAttribute('data-theme');
      const btn = document.getElementById('themeToggleBtn');
      if (btn) btn.textContent = theme === 'dark' ? 'Light' : 'Dark';
      try { localStorage.setItem('br-theme', theme); } catch (_) {}
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      applyTheme(isDark ? 'light' : 'dark');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      let theme = 'light';
      try {
        const saved = localStorage.getItem('br-theme');
        if (saved === 'dark' || saved === 'light') theme = saved;
      } catch (_) {}
      applyTheme(theme);
      await loadUiDemoConfig();
      renderUploadTagPills();
      updateUploadAccessPreview();
      await loadAuthConfig();
      if (authMode === 'demo') {
        await refreshIdentity();
        await afterIdentityChange();
      } else {
        renderUserRoleControls();
        updateWriteControls();
      }
    });

    function handleFileSelect(event) {
      const files = event.target.files;
      if (files && files.length > 0) {
        selectedPdfFile = files[0];
        document.getElementById('selectedFileLabel').innerHTML =
          `<span class="file-selected">${escapeHtml(selectedPdfFile.name)}</span>`;
      }
    }

    function toggleUploadTag(tag) {
      if (selectedUploadTags.has(tag)) selectedUploadTags.delete(tag);
      else selectedUploadTags.add(tag);
      renderUploadTagPills();
      updateUploadAccessPreview();
    }

    function renderUploadTagPills() {
      const container = document.getElementById('uploadTagPills');
      container.innerHTML = availableTags.map(tag => {
        const active = selectedUploadTags.has(tag);
        return `
          <button type="button"
                  onclick="toggleUploadTag('${escapeHtml(tag)}')"
                  class="tag-btn${active ? ' is-active' : ''}">
            <span>${active ? '✓' : '+'}</span>
            <span>${escapeHtml(tag)}</span>
          </button>
        `;
      }).join('');
    }

    function updateUploadAccessPreview() {
      const badge = document.getElementById('uploadAccessPreview');
      const tags = Array.from(selectedUploadTags);
      if (tags.length === 0) {
        badge.className = 'access-preview is-public';
        badge.textContent = 'PUBLIC';
      } else {
        badge.className = 'access-preview is-tagged';
        badge.textContent = `Tag: ${tags.join(', ')}`;
      }
    }

    async function setRolePreset(rolesArray) {
      activeUserRoles = new Set(rolesArray);
      await refreshIdentity();
      await afterIdentityChange();
    }

    function renderUserRoleControls() {
      const roles = Array.from(activeUserRoles);
      const isPublicOnly = roles.length === 0;
      const isFinOnly = roles.length === 1 && roles[0] === 'finance';
      const isOpOnly = roles.length === 1 && roles[0] === 'operation';
      const isBoth = roles.includes('finance') && roles.includes('operation') && roles.length === 2;

      const setBtnStyle = (id, active) => {
        const el = document.getElementById(id);
        el.className = active ? 'btn btn-active' : 'btn';
      };
      setBtnStyle('presetPublicBtn', isPublicOnly);
      setBtnStyle('presetFinanceBtn', isFinOnly);
      setBtnStyle('presetOperationBtn', isOpOnly);
      setBtnStyle('presetAllBtn', isBoth);
      setBtnStyle('presetAdminBtn', roles.length === 1 && roles[0] === 'admin');

      const banner = document.getElementById('chatRoleBanner');
      const who = roles.length === 0 ? 'Public Only' : roles.join(' + ');
      banner.textContent = activeTenant ? `${activeTenant} · ${who}` : 'Not signed in';
    }

    async function fetchDocumentsAndTags() {
      if (!authToken) { documents = []; renderDocumentsList(); return; }
      const resp = await apiFetch('/api/documents');
      const data = await resp.json();
      documents = resp.ok ? (data.documents || []) : [];
      renderUploadTagPills();
      renderUserRoleControls();
      renderDocumentsList();
    }

    async function submitPdfUpload() {
      const statusEl = document.getElementById('uploadStatusMsg');
      const btn = document.getElementById('uploadSubmitBtn');
      if (!selectedPdfFile) return;

      btn.disabled = true;
      statusEl.innerHTML = `<span class="status-busy">Indexing &amp; extracting concepts...</span>`;
      try {
        const formData = new FormData();
        formData.append('file', selectedPdfFile);
        formData.append('tags', Array.from(selectedUploadTags).join(','));
        const sourceKey = (document.getElementById('sourceKeyInput').value || '').trim();
        if (sourceKey) formData.append('source_key', sourceKey);
        const resp = await apiFetch('/api/upload', { method: 'POST', body: formData });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || 'Upload failed');
        const st = escapeHtml(data.document.status || 'INDEXED');
        const sk = data.document.source_key ? ` · source_key=${escapeHtml(data.document.source_key)}` : '';
        statusEl.innerHTML = `<span class="status-ok">${escapeHtml(data.document.filename)} → ${st}${sk}</span>`;
        selectedPdfFile = null;
        document.getElementById('pdfFileInput').value = '';
        document.getElementById('selectedFileLabel').textContent = 'Select PDF / Markdown / TXT';
        await fetchDocumentsAndTags();
      } catch (err) {
        statusEl.innerHTML = `<span class="status-err">${escapeHtml(err.message)}</span>`;
      } finally {
        btn.disabled = !canWrite;
      }
    }

    function canCurrentUserAccessDoc(doc) {
      if (doc.is_public || !doc.tags || doc.tags.length === 0) return true;
      // Roles as the server expanded them (admin includes finance and operation).
      return doc.tags.some(t => expandedRoles.has(t));
    }

    function lifecycleBadge(status) {
      const s = String(status || 'INDEXED').toUpperCase();
      if (s === 'INDEXED') {
        return `<span class="label label-fix">${escapeHtml(s)}</span>`;
      }
      if (s === 'FAILED') {
        return `<span class="label label-fail">${escapeHtml(s)}</span>`;
      }
      if (s === 'SUPERSEDED') {
        return `<span class="lifecycle-plain">${escapeHtml(s)}</span>`;
      }
      // PENDING / PROCESSING — muted ink label, not a coloured chip
      return `<span class="lifecycle-plain">${escapeHtml(s)}</span>`;
    }

    function renderDocumentsList() {
      const container = document.getElementById('documentsList');
      container.innerHTML = documents.map(doc => {
        const accessible = canCurrentUserAccessDoc(doc);
        const superseded = String(doc.status || '').toUpperCase() === 'SUPERSEDED' || doc.is_current === false;
        const accessPill = accessible
          ? `<span class="access-pill access-ok">Unlocked</span>`
          : `<span class="access-pill access-locked">Locked</span>`;

        const tagPills = (doc.is_public || !doc.tags || doc.tags.length === 0)
          ? `<span class="label label-fix">PUBLIC</span>`
          : doc.tags.map(t => `<span class="label label-ink">${escapeHtml(t)}</span>`).join(' ');

        const sk = doc.source_key
          ? `<div class="doc-source">source_key: ${escapeHtml(doc.source_key)}</div>`
          : '';
        const ver = doc.doc_version ? `<span class="doc-ver">v${escapeHtml(String(doc.doc_version))}</span>` : '';

        const rowClass = [
          'doc-row',
          superseded ? 'is-superseded' : '',
          !accessible && !superseded ? 'is-locked' : '',
        ].filter(Boolean).join(' ');

        return `
          <div class="${rowClass}">
            <div class="doc-main">
              <div class="doc-title-row">
                <div class="doc-name">${escapeHtml(doc.filename)}</div>
                ${lifecycleBadge(doc.status)}
                ${ver}
              </div>
              <div class="doc-meta">${tagPills}</div>
              ${sk}
            </div>
            ${accessPill}
          </div>
        `;
      }).join('');
    }

    function runQuickPrompt(text) {
      const input = document.getElementById('chatInput');
      input.value = text;
      handleChatSubmit(new Event('submit'));
    }

    async function loadUiDemoConfig() {
      try {
        const resp = await fetch('/api/ui-demo-config');
        if (!resp.ok) return;
        const cfg = await resp.json();
        if (cfg.html_lang) document.documentElement.lang = String(cfg.html_lang);
        const input = document.getElementById('chatInput');
        if (input && cfg.chat_placeholder) input.placeholder = String(cfg.chat_placeholder);
        const row = document.getElementById('demoPromptsRow');
        if (!row || !Array.isArray(cfg.demo_prompts)) return;
        for (const item of cfg.demo_prompts) {
          const query = String((item && item.query) || '');
          const label = String((item && item.label) || query);
          if (!query) continue;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'prompt-btn';
          btn.textContent = label;
          btn.addEventListener('click', () => runQuickPrompt(query));
          row.appendChild(btn);
        }
      } catch (_) {
        /* demo chrome is optional — chat still works without it */
      }
    }

    async function handleChatSubmit(event) {
      if (event.preventDefault) event.preventDefault();
      const input = document.getElementById('chatInput');
      const question = (input.value || '').trim();
      if (!question) return;

      const roles = Array.from(activeUserRoles);
      const synthesisMode = document.getElementById('synthesisModeSelect').value;
      const messagesContainer = document.getElementById('chatMessages');
      const sendBtn = document.getElementById('chatSendBtn');

      const roleBadge = `<span class="label">${escapeHtml(activeTenant || 'no tenant')}</span> ` + (roles.length
        ? roles.map(r => `<span class="label label-ink">${escapeHtml(r)}</span>`).join(' ')
        : `<span class="label label-fix">public</span>`);

      messagesContainer.insertAdjacentHTML('beforeend', `
        <div class="msg-user">
          <div class="msg-user-bubble">
            ${roleBadge}
            <span class="q">${escapeHtml(question)}</span>
          </div>
        </div>
      `);

      input.value = '';
      sendBtn.disabled = true;
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      try {
        // No tenant and no roles in the body: the server takes both from the token.
        const resp = await apiFetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            question,
            top_k: 4,
            synthesis_mode: synthesisMode,
            fusion: document.getElementById('labFusion').value,
            query_mode: document.getElementById('labQueryMode').value,
            rerank: document.getElementById('labRerank').checked,
            multi_hop: document.getElementById('labMultiHop').checked,
            verify: document.getElementById('labVerify').checked,
            trust_mode: document.getElementById('labTrustMode').value,
          })
        });
        const data = await resp.json();
        if (resp.ok) appendAssistantResponse(data);
        else noteInChat(`Request refused (${resp.status}): ${data.detail || 'no detail'}`);
      } catch (err) {
        noteInChat(`Request failed: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
    }

    function appendAssistantResponse(data) {
      const messagesContainer = document.getElementById('chatMessages');
      const isBlocked = (data.answer || '').includes('🔒') || (data.answer || '').toLowerCase().includes('access denied') || (data.answer || '').toLowerCase().includes('not authorized');
      const cardClass = isBlocked ? 'msg-assistant is-blocked' : 'msg-assistant is-ok';

      let metaInfo = '';
      if (data.is_cross_lingual) {
        metaInfo += `<span class="label label-ink">Cross-Lingual</span> `;
      }
      if (data.latency_ms) {
        metaInfo += `<span class="label">${data.latency_ms} ms</span>`;
      }

      const chunkMeta = (data.authorized_chunks || [])
        .slice(0, 3)
        .map(c => {
          const bt = c.block_type ? escapeHtml(String(c.block_type)) : 'chunk';
          const pg = c.page_number != null ? ` p${escapeHtml(String(c.page_number))}` : '';
          return `<span class="label">${bt}${pg}</span>`;
        })
        .join(' ');

      messagesContainer.insertAdjacentHTML('beforeend', `
        <div class="${cardClass}">
          ${metaInfo ? `<div class="meta-row">${metaInfo}</div>` : ''}
          <div class="msg-body">
            ${formatSimpleMarkdown(data.answer || '')}
          </div>
          ${chunkMeta ? `<div class="chip-row">${chunkMeta}</div>` : ''}
          ${renderTrust(data.trust_report)}
          ${renderTrace(data.retrieval_trace, data.masked_restricted_docs)}
        </div>
      `);
    }

    const TRUST_LABELS = {
      supported: ['Supported', 'label-fix'],
      contradicted: ['Contradicted', 'label-fail'],
      unsupported: ['Not in sources', 'label-fail'],
      invalid_citation: ['Bad citation', 'label-fail'],
      miscited: ['Wrong source cited', 'label-ink'],
      uncited: ['No citation', 'label-ink'],
      unchecked: ['Not checked', ''],
    };
    const VERDICTS = {
      grounded: 'Every statement is supported by its cited source.',
      has_unsupported_claims: 'Some statements are not supported by the sources.',
      citation_problems: 'The facts check out, but some citations are missing or wrong.',
      partly_checked: 'Some statements could not be checked.',
      extractive: 'This answer quotes a retrieved document directly.',
      abstained: 'No answer was given.',
    };

    function renderTrust(report) {
      if (!report) return '';
      const verdict = VERDICTS[report.verdict] || report.verdict;
      const failed = (report.checks || []).includes('llm_failed') ? '<div class="trace-note">The LLM check failed, so only values and citations were checked.</div>' : '';
      const rows = (report.sentences || []).map(s => {
        const [label, cls] = TRUST_LABELS[s.status] || [s.status, ''];
        const why = (s.reasons || []).join(' ');
        return `<div class="trust-row"><span class="label ${cls}">${escapeHtml(label)}</span><span>${escapeHtml(s.text)}${why ? `<br/><span class="trace-note">${escapeHtml(why)}</span>` : ''}</span></div>`;
      }).join('');
      const extra = report.abstained && report.abstain_reason ? `<div class="trace-note">${escapeHtml(report.abstain_reason)}</div>` : (report.removed ? `<div class="trace-note">${escapeHtml(report.removed)} statement(s) removed from the answer.</div>` : '');
      return `<details class="trace" open><summary>Trust report: ${escapeHtml(verdict)}</summary>${failed}${extra}<div class="trace-stage">${rows}</div></details>`;
    }

    function traceRows(items) {
      return items.map(item => `
        <div class="trace-row">
          <span class="rank ${item.rankClass || ''}">${escapeHtml(item.rank)}</span>
          <span class="name">${escapeHtml(item.name)}</span>
          <span class="why">${escapeHtml(item.why || '')}</span>
        </div>`).join('');
    }

    function traceStage(title, body) {
      return `<div class="trace-stage"><div class="trace-title">${escapeHtml(title)}</div>${body}</div>`;
    }

    function renderTrace(trace, masked) {
      if (!trace) return '';
      const stages = [];
      const variants = trace.variants || [];
      if (variants.length > 1) {
        stages.push(traceStage('Query transformation', variants.map(v =>
          `<div class="trace-note"><span class="label">${escapeHtml(v.kind)}</span> ${escapeHtml(v.text)}</div>`).join('')));
      }
      for (const error of trace.transform_errors || []) {
        stages.push(traceStage('Query transformation failed', `<div class="trace-note">${escapeHtml(error)}</div>`));
      }
      for (const hop of trace.hops || []) {
        stages.push(traceStage(`Hop ${hop.step}`, `
          <div class="trace-note"><strong>Searched:</strong> ${escapeHtml(hop.search)}</div>
          ${hop.answer ? `<div class="trace-note"><strong>Found:</strong> ${escapeHtml(hop.answer)}</div>` : ''}
          <div class="trace-note"><strong>Sources:</strong> ${escapeHtml((hop.sources || []).join(', ') || 'none visible to this role')}</div>`));
      }
      if (trace.stopped_reason) {
        stages.push(traceStage('Stopped', `<div class="trace-note">${escapeHtml(trace.stopped_reason)}</div>`));
      }
      const first = trace.first_stage || {};
      const rankings = first.rankings || {};
      if ((rankings.lexical || []).length || (rankings.dense || []).length) {
        const docName = id => String(id).replace(/^doc-/, '').replace(/-[0-9a-f]{12}_p\d+_c\d+$/, '');
        const list = ids => (ids || []).slice(0, 3).map((id, i) => `${i + 1}. ${escapeHtml(docName(id))}`).join('<br/>') || 'no matches';
        stages.push(traceStage('First-stage rankings', `
          <div class="trace-note"><strong>BM25:</strong><br/>${list(rankings.lexical)}</div>
          <div class="trace-note"><strong>Dense:</strong><br/>${list(rankings.dense)}</div>`));
      }
      const rerank = trace.rerank;
      if (rerank && rerank.status === 'applied') {
        stages.push(traceStage(`Re-ranked ${rerank.pairs} candidates in ${Math.round(rerank.latency_ms)} ms`, traceRows(rerank.moved.slice(0, 5).map(m => ({
          rank: `${m.from} → ${m.to}`,
          rankClass: m.to < m.from ? 'up' : m.to > m.from ? 'down' : '',
          name: m.filename,
          why: Number(m.score).toFixed(3),
        })))));
      } else if (rerank) {
        stages.push(traceStage(`Re-ranking ${rerank.status}`, `<div class="trace-note">${escapeHtml(rerank.reason || '')}</div>`));
      }
      const parents = trace.parents || {};
      if (parents.expanded) {
        stages.push(traceStage('Small-to-big', `<div class="trace-note">Searched small chunks, then passed ${escapeHtml(parents.expanded)} full parent section(s) to the model, merging ${escapeHtml(parents.children_merged)} duplicate hit(s).</div>`));
      }
      if ((masked || []).length) {
        stages.push(traceStage('Blocked by your role', masked.slice(0, 4).map(doc =>
          `<div class="trace-note">${escapeHtml(doc.filename)}: needs ${escapeHtml((doc.required_any_of_tags || []).join(' or '))}</div>`).join('')));
      }
      if (!stages.length) return '';
      return `<details class="trace"><summary>How this was retrieved</summary>${stages.join('')}</details>`;
    }

    async function seedRetrievalLab() {
      const button = document.getElementById('labSeedBtn');
      button.disabled = true;
      button.textContent = 'Loading...';
      try {
        const resp = await apiFetch('/api/seed-lab', { method: 'POST' });
        const data = await resp.json();
        button.textContent = resp.ok ? `Loaded ${data.seeded} documents` : (resp.status === 403 ? 'Needs the Admin role' : 'Loading failed');
        await fetchDocumentsAndTags();
      } catch (_) {
        button.textContent = 'Loading failed';
      } finally {
        button.disabled = !canWrite;
      }
    }

    function formatSimpleMarkdown(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br/>');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
