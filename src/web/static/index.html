<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeyondRAG | Enterprise RBAC &amp; Cross-Lingual RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            ctp: {
              rosewater: '#f5e0dc',
              flamingo: '#f2cdcd',
              pink: '#f5c2e7',
              mauve: '#cba6f7',
              red: '#f38ba8',
              maroon: '#eba0ac',
              peach: '#fab387',
              yellow: '#f9e2af',
              green: '#a6e3a1',
              teal: '#94e2d5',
              sky: '#89dceb',
              sapphire: '#74c7ec',
              blue: '#89b4fa',
              lavender: '#b4befe',
              text: '#cdd6f4',
              subtext1: '#bac2de',
              subtext0: '#a6adc8',
              overlay2: '#9399b2',
              overlay1: '#7f849c',
              overlay0: '#6c7086',
              surface2: '#585b70',
              surface1: '#45475a',
              surface0: '#313244',
              base: '#1e1e2e',
              mantle: '#181825',
              crust: '#11111b',
            }
          }
        }
      }
    };
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #11111b; }
    ::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #585b70; }
  </style>
</head>
<body class="bg-ctp-crust text-ctp-text min-h-screen flex flex-col font-sans antialiased selection:bg-ctp-mauve selection:text-ctp-crust">

  <!-- Catppuccin Mocha Sleek Top Bar -->
  <header class="border-b border-ctp-surface0 bg-ctp-mantle/95 backdrop-blur sticky top-0 z-30 shadow-md shadow-ctp-crust/50">
    <div class="max-w-[1400px] mx-auto px-5 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-ctp-mauve via-ctp-lavender to-ctp-blue flex items-center justify-center font-black text-ctp-crust text-base shadow-lg shadow-ctp-mauve/25">
          BR
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg font-extrabold tracking-tight text-ctp-text">BeyondRAG</h1>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-ctp-mauve/15 text-ctp-mauve border border-ctp-mauve/30">
              Catppuccin Mocha
            </span>
          </div>
          <p class="text-xs text-ctp-subtext0">Enterprise RBAC &amp; Cross-Lingual Knowledge Base</p>
        </div>
      </div>

      <!-- Active Role Switcher -->
      <div class="flex flex-wrap items-center gap-2 bg-ctp-base border border-ctp-surface0 rounded-xl px-3.5 py-1.5 shadow-inner">
        <span class="text-xs font-bold uppercase tracking-wider text-ctp-subtext0 mr-1 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-ctp-lavender animate-pulse"></span>
          Role:
        </span>
        <button onclick="setRolePreset([])" id="presetPublicBtn" class="px-3.5 py-1.5 rounded-lg text-sm font-bold transition border">
          Public Only
        </button>
        <button onclick="setRolePreset(['finance'])" id="presetFinanceBtn" class="px-3.5 py-1.5 rounded-lg text-sm font-bold transition border">
          Finance Role
        </button>
        <button onclick="setRolePreset(['operation'])" id="presetOperationBtn" class="px-3.5 py-1.5 rounded-lg text-sm font-bold transition border">
          Operation Role
        </button>
        <button onclick="setRolePreset(['finance', 'operation'])" id="presetAllBtn" class="px-3.5 py-1.5 rounded-lg text-sm font-bold transition border">
          All Roles
        </button>
      </div>
    </div>
  </header>

  <!-- Main 2-Section Layout: (1) PDF Upload & Knowledge Base + (2) Multi-Lingual Chat -->
  <main class="max-w-[1400px] w-full mx-auto px-5 py-5 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5">

    <!-- SECTION 1: PDF UPLOAD & KNOWLEDGE BASE LIST (5 cols) -->
    <section class="lg:col-span-5 bg-ctp-mantle/90 border border-ctp-surface0 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-extrabold text-ctp-text uppercase tracking-wider flex items-center gap-2.5">
          <span class="w-3 h-3 rounded-full bg-ctp-lavender shadow-sm shadow-ctp-lavender/50"></span>
          1. PDF Upload &amp; Knowledge Base
        </h2>
        <span id="uploadAccessPreview" class="px-3 py-1 rounded-full text-xs font-bold font-mono"></span>
      </div>

      <!-- Compact Upload & Tag Bar -->
      <div class="bg-ctp-base border border-ctp-surface0 rounded-xl p-4 space-y-3.5 shadow-sm">
        <div id="dropZone"
             onclick="document.getElementById('pdfFileInput').click()"
             class="border border-dashed border-ctp-surface1 hover:border-ctp-lavender rounded-lg px-3.5 py-3 text-center cursor-pointer transition bg-ctp-mantle/60 flex items-center justify-between gap-2 group">
          <input type="file" id="pdfFileInput" accept=".pdf,application/pdf" class="hidden" onchange="handleFileSelect(event)" />
          <span id="selectedFileLabel" class="text-sm font-semibold text-ctp-text truncate group-hover:text-ctp-lavender transition">
            📄 Select PDF to Upload
          </span>
          <span class="px-2.5 py-1 rounded bg-ctp-surface0 text-xs font-bold text-ctp-subtext1 group-hover:bg-ctp-lavender group-hover:text-ctp-crust transition shrink-0">Browse</span>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xs font-bold text-ctp-subtext0">RBAC Tag:</span>
            <div id="uploadTagPills" class="flex flex-wrap gap-2"></div>
          </div>

          <button id="uploadSubmitBtn"
                  onclick="submitPdfUpload()"
                  class="px-4 py-2 rounded-lg bg-ctp-lavender hover:bg-ctp-blue text-sm font-black text-ctp-crust shadow-md shadow-ctp-lavender/20 transition active:scale-95">
            Upload PDF
          </button>
        </div>
        <div id="uploadStatusMsg" class="text-xs font-semibold text-ctp-subtext1 empty:hidden"></div>
      </div>

      <!-- Knowledge Base Uploaded PDFs List -->
      <div class="flex-1 flex flex-col min-h-0">
        <div class="flex items-center justify-between mb-2.5">
          <span class="text-xs font-extrabold uppercase tracking-wider text-ctp-subtext0">
            Knowledge Base PDFs
          </span>
          <span id="chatRoleBanner" class="text-xs font-bold font-mono text-ctp-sapphire"></span>
        </div>
        <div id="documentsList" class="space-y-2.5 overflow-y-auto pr-1"></div>
      </div>
    </section>

    <!-- SECTION 2: MULTI-LINGUAL RBAC CHAT (7 cols) -->
    <section class="lg:col-span-7 bg-ctp-mantle/90 border border-ctp-surface0 rounded-2xl shadow-xl flex flex-col overflow-hidden min-h-[640px]">

      <!-- Pre-Generated Multi-Lingual Query Chips -->
      <div class="p-4 border-b border-ctp-surface0 bg-ctp-base/70 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-extrabold text-ctp-text uppercase tracking-wider flex items-center gap-2.5">
            <span class="w-3 h-3 rounded-full bg-ctp-sapphire shadow-sm shadow-ctp-sapphire/50"></span>
            2. Multi-Lingual RBAC Chat
          </h2>
          <select id="synthesisModeSelect" class="bg-ctp-mantle border border-ctp-surface0 text-ctp-subtext0 text-xs rounded-lg px-2.5 py-1 font-mono focus:border-ctp-lavender">
            <option value="fast">Instant Citation</option>
            <option value="llm">Grounded LLM (Ollama)</option>
          </select>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <span class="text-xs font-extrabold text-ctp-sapphire mr-1">Demo Prompts:</span>
          <button onclick="runQuickPrompt('八號風球及混合辦公考勤政策是什麼？')"
                  class="px-3 py-1.5 rounded-lg bg-ctp-green/15 hover:bg-ctp-green/25 border border-ctp-green/30 text-xs font-bold text-ctp-green transition active:scale-95">
            [Public 公開] 八號風球考勤
          </button>
          <button onclick="runQuickPrompt('最低港元現金儲備緩衝是多少？外匯遠期合約限額是多少？')"
                  class="px-3 py-1.5 rounded-lg bg-ctp-mauve/15 hover:bg-ctp-mauve/25 border border-ctp-mauve/30 text-xs font-bold text-ctp-mauve transition active:scale-95">
            [Finance 財務] 最低港元現金儲備
          </button>
          <button onclick="runQuickPrompt('葵青貨櫃碼頭的準時調度SLA和冷鏈溫度是多少？')"
                  class="px-3 py-1.5 rounded-lg bg-ctp-peach/15 hover:bg-ctp-peach/25 border border-ctp-peach/30 text-xs font-bold text-ctp-peach transition active:scale-95">
            [Operation 營運] 葵青碼頭SLA
          </button>
          <button onclick="runQuickPrompt('召回的 Nutrilon Duobalans 1 批號和保質期是多少？')"
                  class="px-3 py-1.5 rounded-lg bg-ctp-teal/15 hover:bg-ctp-teal/25 border border-ctp-teal/30 text-xs font-bold text-ctp-teal transition active:scale-95">
            [Recall 召回] Nutrilon 批號保質期
          </button>
        </div>
      </div>

      <!-- Clean Chat Stream -->
      <div id="chatMessages" class="flex-1 p-5 space-y-3.5 overflow-y-auto"></div>

      <!-- Chat Input -->
      <form onsubmit="handleChatSubmit(event)" class="p-4 border-t border-ctp-surface0 bg-ctp-base/80 flex gap-2.5">
        <input id="chatInput"
               type="text"
               placeholder="Click a query above or ask in Chinese / English / Dutch..."
               class="flex-1 bg-ctp-crust border border-ctp-surface0 rounded-xl px-4 py-2.5 text-sm font-medium text-ctp-text placeholder-ctp-overlay0 focus:outline-none focus:border-ctp-lavender transition" />
        <button id="chatSendBtn"
                type="submit"
                class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-ctp-mauve via-ctp-lavender to-ctp-blue hover:opacity-90 text-sm font-black text-ctp-crust shadow-lg shadow-ctp-mauve/20 transition active:scale-95">
          Ask KB
        </button>
      </form>
    </section>
  </main>

  <script>
    let availableTags = ['finance', 'operation'];
    let selectedUploadTags = new Set();
    let activeUserRoles = new Set();
    let documents = [];
    let selectedPdfFile = null;

    window.addEventListener('DOMContentLoaded', async () => {
      renderUploadTagPills();
      updateUploadAccessPreview();
      await fetchDocumentsAndTags();
      renderUserRoleControls();
    });

    function handleFileSelect(event) {
      const files = event.target.files;
      if (files && files.length > 0) {
        selectedPdfFile = files[0];
        document.getElementById('selectedFileLabel').innerHTML =
          `📄 <span class="text-ctp-green font-extrabold">${escapeHtml(selectedPdfFile.name)}</span>`;
      }
    }

    function toggleUploadTag(tag) {
      if (selectedUploadTags.has(tag)) selectedUploadTags.delete(tag);
      else selectedUploadTags.add(tag);
      renderUploadTagPills();
      updateUploadAccessPreview();
    }

    function renderUploadTagPills() {
      const container = document.getElementById('uploadTagPills');
      container.innerHTML = availableTags.map(tag => {
        const active = selectedUploadTags.has(tag);
        const activeClass = tag === 'finance'
          ? 'bg-ctp-mauve text-ctp-crust border-ctp-mauve shadow-sm'
          : 'bg-ctp-peach text-ctp-crust border-ctp-peach shadow-sm';
        const inactiveClass = 'bg-ctp-base text-ctp-subtext0 border-ctp-surface0 hover:border-ctp-surface1 hover:text-ctp-text';
        return `
          <button type="button"
                  onclick="toggleUploadTag('${escapeHtml(tag)}')"
                  class="px-3 py-1.5 rounded-lg text-sm font-bold border transition flex items-center gap-1.5 ${active ? activeClass : inactiveClass}">
            <span>${active ? '✓' : '+'}</span>
            <span>${escapeHtml(tag)}</span>
          </button>
        `;
      }).join('');
    }

    function updateUploadAccessPreview() {
      const badge = document.getElementById('uploadAccessPreview');
      const tags = Array.from(selectedUploadTags);
      if (tags.length === 0) {
        badge.className = 'px-3 py-1 rounded-full text-xs font-bold font-mono bg-ctp-green/15 text-ctp-green border border-ctp-green/30';
        badge.textContent = 'PUBLIC';
      } else {
        badge.className = 'px-3 py-1 rounded-full text-xs font-bold font-mono bg-ctp-mauve/20 text-ctp-mauve border border-ctp-mauve/40';
        badge.textContent = `Tag: ${tags.join(', ')}`;
      }
    }

    function setRolePreset(rolesArray) {
      activeUserRoles = new Set(rolesArray);
      renderUserRoleControls();
      renderDocumentsList();
    }

    function renderUserRoleControls() {
      const roles = Array.from(activeUserRoles);
      const isPublicOnly = roles.length === 0;
      const isFinOnly = roles.length === 1 && roles[0] === 'finance';
      const isOpOnly = roles.length === 1 && roles[0] === 'operation';
      const isBoth = roles.includes('finance') && roles.includes('operation') && roles.length === 2;

      const setBtnStyle = (id, active) => {
        const el = document.getElementById(id);
        el.className = active
          ? 'px-3.5 py-1.5 rounded-lg text-sm font-extrabold transition border bg-ctp-lavender/25 border-ctp-lavender text-ctp-lavender shadow-sm'
          : 'px-3.5 py-1.5 rounded-lg text-sm font-semibold transition border bg-ctp-base border-ctp-surface0 text-ctp-subtext0 hover:text-ctp-text hover:border-ctp-surface1';
      };
      setBtnStyle('presetPublicBtn', isPublicOnly);
      setBtnStyle('presetFinanceBtn', isFinOnly);
      setBtnStyle('presetOperationBtn', isOpOnly);
      setBtnStyle('presetAllBtn', isBoth);

      const banner = document.getElementById('chatRoleBanner');
      banner.textContent = roles.length === 0
        ? 'Active: Public Only'
        : `Active: ${roles.join(' + ')}`;
    }

    async function fetchDocumentsAndTags() {
      const resp = await fetch('/api/documents');
      const data = await resp.json();
      documents = data.documents || [];
      renderUploadTagPills();
      renderUserRoleControls();
      renderDocumentsList();
    }

    async function submitPdfUpload() {
      const statusEl = document.getElementById('uploadStatusMsg');
      const btn = document.getElementById('uploadSubmitBtn');
      if (!selectedPdfFile) return;

      btn.disabled = true;
      statusEl.innerHTML = `<span class="text-ctp-sapphire animate-pulse">⏳ Indexing & extracting concepts...</span>`;
      try {
        const formData = new FormData();
        formData.append('file', selectedPdfFile);
        formData.append('tags', Array.from(selectedUploadTags).join(','));
        const resp = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || 'Upload failed');
        statusEl.innerHTML = `<span class="text-ctp-green font-bold">✓ Added ${escapeHtml(data.document.filename)}</span>`;
        selectedPdfFile = null;
        document.getElementById('pdfFileInput').value = '';
        await fetchDocumentsAndTags();
      } catch (err) {
        statusEl.innerHTML = `<span class="text-ctp-red font-bold">${escapeHtml(err.message)}</span>`;
      } finally {
        btn.disabled = false;
      }
    }

    function canCurrentUserAccessDoc(doc) {
      if (doc.is_public || !doc.tags || doc.tags.length === 0) return true;
      return doc.tags.some(t => activeUserRoles.has(t));
    }

    function renderDocumentsList() {
      const container = document.getElementById('documentsList');
      container.innerHTML = documents.map(doc => {
        const accessible = canCurrentUserAccessDoc(doc);
        const statusPill = accessible
          ? `<span class="px-2.5 py-1 rounded-lg text-xs font-extrabold font-mono bg-ctp-green/20 text-ctp-green border border-ctp-green/35 shrink-0">✓ Unlocked</span>`
          : `<span class="px-2.5 py-1 rounded-lg text-xs font-extrabold font-mono bg-ctp-red/20 text-ctp-red border border-ctp-red/35 shrink-0">🔒 Locked</span>`;

        const tagPills = (doc.is_public || !doc.tags || doc.tags.length === 0)
          ? `<span class="px-2 py-0.5 rounded text-xs font-mono font-bold bg-ctp-green/15 text-ctp-green border border-ctp-green/25">PUBLIC</span>`
          : doc.tags.map(t => {
              const colorClass = t === 'finance'
                ? 'bg-ctp-mauve/20 text-ctp-mauve border-ctp-mauve/35'
                : 'bg-ctp-peach/20 text-ctp-peach border-ctp-peach/35';
              return `<span class="px-2 py-0.5 rounded text-xs font-mono font-bold border ${colorClass}">${escapeHtml(t)}</span>`;
            }).join(' ');

        return `
          <div class="px-4 py-3 rounded-xl border transition flex items-center justify-between gap-3 ${accessible ? 'bg-ctp-base border-ctp-surface0 hover:border-ctp-surface1' : 'bg-ctp-mantle/60 border-ctp-surface0/60 opacity-60'}">
            <div class="min-w-0 flex-1">
              <div class="text-sm font-extrabold text-ctp-text truncate">${escapeHtml(doc.filename)}</div>
              <div class="flex items-center gap-2 mt-1">
                ${tagPills}
              </div>
            </div>
            ${statusPill}
          </div>
        `;
      }).join('');
    }

    function runQuickPrompt(text) {
      const input = document.getElementById('chatInput');
      input.value = text;
      handleChatSubmit(new Event('submit'));
    }

    async function handleChatSubmit(event) {
      if (event.preventDefault) event.preventDefault();
      const input = document.getElementById('chatInput');
      const question = (input.value || '').trim();
      if (!question) return;

      const roles = Array.from(activeUserRoles);
      const synthesisMode = document.getElementById('synthesisModeSelect').value;
      const messagesContainer = document.getElementById('chatMessages');
      const sendBtn = document.getElementById('chatSendBtn');

      const roleBadge = roles.length
        ? roles.map(r => `<span class="px-2 py-0.5 rounded bg-ctp-mauve/30 text-ctp-mauve text-xs font-mono font-bold">${escapeHtml(r)}</span>`).join(' ')
        : `<span class="px-2 py-0.5 rounded bg-ctp-green/25 text-ctp-green text-xs font-mono font-bold">public</span>`;

      messagesContainer.insertAdjacentHTML('beforeend', `
        <div class="flex justify-end">
          <div class="max-w-[90%] bg-ctp-blue/20 border border-ctp-blue/40 rounded-2xl px-4 py-2.5 text-sm text-ctp-text flex items-center gap-2 shadow-sm">
            ${roleBadge}
            <span class="font-bold">${escapeHtml(question)}</span>
          </div>
        </div>
      `);

      input.value = '';
      sendBtn.disabled = true;
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, user_roles: roles, top_k: 4, synthesis_mode: synthesisMode })
        });
        const data = await resp.json();
        appendAssistantResponse(data);
      } finally {
        sendBtn.disabled = false;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
    }

    function appendAssistantResponse(data) {
      const messagesContainer = document.getElementById('chatMessages');
      const isBlocked = (data.answer || '').includes('🔒');
      const cardBorder = isBlocked ? 'border-2 border-ctp-red/60 bg-ctp-red/10' : 'border-2 border-ctp-green/45 bg-ctp-base';

      let metaInfo = '';
      if (data.is_cross_lingual) {
        metaInfo += `<span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-ctp-teal/20 text-ctp-teal border border-ctp-teal/35">🌐 Cross-Lingual (ZH→Doc)</span> `;
      }
      if (data.latency_ms) {
        metaInfo += `<span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-ctp-surface0 text-ctp-subtext0">${data.latency_ms} ms</span>`;
      }

      messagesContainer.insertAdjacentHTML('beforeend', `
        <div class="rounded-2xl p-4 space-y-2 shadow-md ${cardBorder}">
          ${metaInfo ? `<div class="flex items-center gap-2">${metaInfo}</div>` : ''}
          <div class="text-sm text-ctp-text leading-relaxed font-medium">
            ${formatSimpleMarkdown(data.answer || '')}
          </div>
        </div>
      `);
    }

    function formatSimpleMarkdown(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, '<strong class="text-ctp-lavender font-extrabold">$1</strong>')
        .replace(/\*(.+?)\*/g, '<em class="text-ctp-subtext1">$1</em>')
        .replace(/`([^`]+)`/g, '<code class="px-2 py-0.5 rounded bg-ctp-surface0 text-ctp-teal font-mono text-xs font-bold border border-ctp-surface1">$1</code>')
        .replace(/\n/g, '<br/>');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
