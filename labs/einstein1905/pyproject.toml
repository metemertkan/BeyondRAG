[project]
name = "einstein1905"
version = "0.1.0"
description = "Episode 8 lab: can a model that stops in May 1905 find special relativity?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.9",
    "tiktoken",
    "rustbpe",
    "tokenizers",
    "huggingface_hub",
    "numpy",
    "pyyaml",
    "requests",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
